name: CI/CD + Security Scan

on:
  push:
    branches: [main, arena/*]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *' # Daily 3AM UTC security scan

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check || npx tsc --noEmit
      - run: npx next lint || echo "Lint warnings"

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency audit
        run: npm audit --audit-level=high || true
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
      - uses: github/codeql-action/analyze@v3

  build:
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Docker build
        run: docker build -t inkocaller:${{ github.sha }} .

  webrtc-test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: |
          npm start &
          sleep 10
          curl -f http://localhost:3000/api/health || exit 1
      - name: Test 2-participant enforcement
        run: |
          # Create session
          SESSION=$(curl -s -X POST http://localhost:3000/api/session | jq -r .sessionId)
          echo "Session: $SESSION"
          # Try to simulate 3rd participant rejection via API check
          # Real WebRTC test would use Playwright
          curl -f http://localhost:3000/api/session?id=$SESSION

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build, webrtc-test]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel/Cloudflare (free tier)
        run: echo "Deploy step - configure VERCEL_TOKEN or CLOUDFLARE_API_TOKEN secrets"
      # - uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.ORG_ID }}
      #     vercel-project-id: ${{ secrets.PROJECT_ID }}
