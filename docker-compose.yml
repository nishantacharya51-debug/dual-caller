version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - TURN_SECRET=${TURN_SECRET:-inkocaller-dev-secret}
      - DATABASE_URL=${DATABASE_URL:-}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis
      - postgres
      - coturn
    restart: unless-stopped
    networks:
      - inkocaller

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - inkocaller

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: inkocaller
      POSTGRES_USER: inkocaller
      POSTGRES_PASSWORD: inkocaller_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - inkocaller

  coturn:
    image: coturn/coturn:4.6-alpine
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49160-49200:49160-49200/udp"
    environment:
      - TURN_SECRET=${TURN_SECRET:-inkocaller-dev-secret}
    command: >
      -n --log-file=stdout
      --external-ip=$$(detect-external-ip)
      --listening-port=3478 --tls-listening-port=5349
      --min-port=49160 --max-port=49200
      --fingerprint --lt-cred-mech --use-auth-secret --static-auth-secret=${TURN_SECRET:-inkocaller-dev-secret}
      --realm=inkocaller.app --no-multicast-peers --no-cli
      --no-tls --no-dtls
    restart: unless-stopped
    networks:
      - inkocaller

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - inkocaller

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    networks:
      - inkocaller

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  inkocaller:
    driver: bridge
